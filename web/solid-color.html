<!DOCTYPE html>
<html>
    <head>
        <title>Nightstand Lamp++</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>

    <body>
        <div id="tainer">
            <div id="header">
                <img class="flexed" src="/static/lamp.png" />
                Nightstand Lamp++
            </div>

            <div id="mode-switcher">
                <button class="mode-switcher-button" id="btn_mode_immediate">
                    Set image
                </button>

                <button class="mode-switcher-button active" id="btn_mode_solid_color">
                    Solid color
                </button>

                <button class="mode-switcher-button" id="btn_mode_matrix">
                    Matrix
                </button>

                <button class="mode-switcher-button" id="btn_mode_template">
                    Pick from template
                </button>

                <button class="mode-switcher-button" id="btn_mode_switch_off">
                    Switch off
                </button>
            </div>

            <div id="sc_tainer">
                <div id="sc_color_picker_outer" class="color-picker-tainer">
                    <div class="color-picker-block">
                        <canvas id="color_space" width=500 height=500></canvas>
                        <canvas id="value_bar" width=10 height=500></canvas>
                    </div>

                    <div id="sc_rgb_hsv">
                        <span>R</span> <input type="number" min="0" max="255" id="color_r"/>
                        <span>G</span> <input type="number" min="0" max="255" id="color_g" />
                        <span>B</span> <input type="number" min="0" max="255" id="color_b" />

                        <div class="v-spacer"></div><div></div>

                        <span>H</span> <input type="number" min="0" max="359" id="color_h"/>
                        <span>S</span> <input type="number" min="0" max="100" id="color_s" />
                        <span>V</span> <input type="number" min="0" max="100" id="color_v" />

                        <div class="v-spacer"></div><div></div>

                        <canvas id="color_picker_preview" class="color-picker-preview" width=1 height=1></canvas>

                        <div class="v-spacer"></div><div></div>

                        <div class="vflex gap" style="grid-column: 1 / span 2">
                            <button id="btn_brighten">
                                Brighten
                            </button>
                            <button id="btn_dim">
                                Dim
                            </button>
                        </div>
                    </div>
                </div>

                <div class="hflex gap">
                    <button id='btn_upload_to_lamp' class="flex1">
                        Upload to lamp!
                    </button>
                    <button id='btn_upload_to_lamp_smoothly' class="flex1">
                        Upload to lamp smoothly!
                    </button>
                </div>

                <button id='btn_save_as_template'>
                    Save as template
                </button>
            </div>

            <div id="error_message_box" class="error-message">
            </div>
        </div>

        <script src="/static/common.js"></script>
        <script src="/static/color.js"></script>

        <script>
            function clearError() {
                error_message_box.innerText = '';
            }

            function displayError(error) {
                error_message_box.innerText = `Error: ${error}`;
            }

            async function uploadColorToLamp(r, g, b, transition_steps) {
                r = Math.round(r);
                g = Math.round(g);
                b = Math.round(b);
                const resp = await fetch(`/solid-color/${r}/${g}/${b}/${transition_steps}`, { method: 'POST' });

                if (!resp.ok) {
                    const reason = await resp.text();
                    displayError(reason);
                    console.error(resp);

                    return false;
                }

                return true;
            }

            async function uploadCurrentColorToLamp(transition_steps) {
                return await uploadColorToLamp(current_r, current_g, current_b, transition_steps);
            }

            async function getCurrentColor() {
                const resp = await fetch('/solid-color/current', { method: 'GET' });
                if (resp.ok) {
                    const j = await resp.json();
                    current_r = j[0] ?? 128;
                    current_g = j[1] ?? 255;
                    current_b = j[2] ?? 255;

                    updateCurrentColorRgb(current_r, current_g, current_b);
                }
            }

            async function saveColorAsTemplate() {
                const canvas = new OffscreenCanvas(FRAME_COLS, FRAME_ROWS);
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = `rgb(${current_r} ${current_g} ${current_b})`;
                ctx.fillRect(0, 0, FRAME_COLS, FRAME_ROWS);

                const pixels = ctx.getImageData(0, 0, FRAME_COLS, FRAME_ROWS, { colorspace: "sRGB", pixelFormat: "rgba-unorm8" }).data;
                const pixelsNoAlpha = new Uint8Array(FRAME_COLS * FRAME_ROWS * 3);
                for (let idx = 0, jdx = 0; idx < pixels.length; idx++) {
                    if (idx % 4 !== 3) pixelsNoAlpha[jdx++] = pixels[idx];
                }

                const name = askForTemplateName();
                if (!name) return;

                try {
                    const resp = await postImage(`/template/save/${name}`, pixelsNoAlpha);
                    if (resp.ok) {
                        console.log('saved');
                    } else {
                        const reason = await resp.text();

                        displayError(reason);
                        console.error(reason);
                    }
                } catch(e) {
                    const reason = e.toString();

                    displayError(reason);
                    console.error(e.toString());
                }
            }

            color_r.onchange = (ev) => {
                updateCurrentColorRgb(parseInt(ev.target.value), current_g, current_b);
            };
            color_g.onchange = (ev) => {
                updateCurrentColorRgb(current_r, parseInt(ev.target.value), current_b);
            };
            color_b.onchange = (ev) => {
                updateCurrentColorRgb(current_r, current_g, parseInt(ev.target.value));
            };
            color_h.onchange = (ev) => {
                updateCurrentColorHsv(parseInt(ev.target.value), current_s, current_v);
            };
            color_s.onchange = (ev) => {
                updateCurrentColorHsv(current_h, parseInt(ev.target.value) / 100, current_v);
            };
            color_v.onchange = (ev) => {
                updateCurrentColorHsv(current_h, current_s, parseInt(ev.target.value) / 100);
            };

            btn_upload_to_lamp.onclick = async () => {
                clearError();

                uploadColorToLamp(current_r, current_g, current_b, 1);
            };

            btn_upload_to_lamp_smoothly.onclick = async () => {
                clearError();

                uploadColorToLamp(current_r, current_g, current_b, 30);
            };

            btn_save_as_template.onclick = () => {
                saveColorAsTemplate();
            };

            btn_brighten.onclick = () => {
                const v = Math.min(current_v + 0.05, 1.0);
                updateCurrentColorHsv(current_h, current_s, v);

                uploadCurrentColorToLamp(5);
            };

            btn_dim.onclick = () => {
                const v = Math.max(current_v - 0.05, 0.0);
                updateCurrentColorHsv(current_h, current_s, v);

                uploadCurrentColorToLamp(5);
            };

            drawColorSpace();
            getCurrentColor();

            const observer = new ResizeObserver(() => {
                let h = sc_color_picker_outer.getBoundingClientRect().height;
                h = clamp(h, 0, MAX_CTRL_HEIGHT_PX);
                color_space.style.height = `${h}px`;
                value_bar.style.height = `${h}px`;
            });
            observer.observe(sc_color_picker_outer);

        </script>
    </body>
 </html>
